<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0f2f5;
        padding: 20px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        width: 180px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .card .category {
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
      }
      .card .name {
        font-size: 18px;
        font-weight: bold;
        margin: 6px 0;
      }
      .card .price {
        color: #2ecc71;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="shop"></div>
    <script src="script.js"></script>
  </body>
</html>
