<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      gap: 15px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
  </style>
  <body>
    <div class="container">
      <button id="login" style="background-color: red">Login In</button>
      <button id="protected">Protected route</button>
      <button id="unprotected" style="background-color: green">
        Unprotected route
      </button>
    </div>
    <script src="token.js"></script>
  </body>
</html>
